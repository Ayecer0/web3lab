<!DOCTYPE html>
<html lang="ru" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Лабораторная работа №5: работа с Fetch API, JSON и localStorage">
  <title>Гончарюк Вадим — Лабораторная работа №5</title>

  <!-- Скрипт предотвращения мерцания темы -->
  <script>
    (function applySavedThemeImmediately() {
      try {
        var savedTheme = localStorage.getItem('app_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.remove('theme-light');
          document.documentElement.classList.add('theme-dark');
        }
      } catch (err) {}
    })();
  </script>

  <style>
    /* Встроенные стили для лабораторной работы №5 */
    :root, html.theme-light {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-input: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-contrast: #ffffff;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
      --toast-success-bg: #14532d;
      --toast-success-text: #ffffff;
      --toast-error-bg: #7f1d1d;
      --toast-error-text: #ffffff;
    }

    html.theme-dark {
      --bg-page: #0f172a;
      --bg-surface: #1e293b;
      --bg-input: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary-color: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-contrast: #0f172a;
      --card-shadow: 0 4px 8px -1px rgba(0, 0, 0, 0.4);
      --toast-success-bg: #166534;
      --toast-success-text: #ffffff;
      --toast-error-bg: #991b1b;
      --toast-error-text: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    .site-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 4.25rem;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .main-content {
      padding-top: 2rem;
      padding-bottom: 4rem;
    }

    .page-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 2rem;
    }

    .card-section {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      box-shadow: var(--card-shadow);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .section-title, .section-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: var(--primary-contrast);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .loader-container[hidden] {
      display: none;
    }

    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 4px solid var(--border-color);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .gallery-status {
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .gallery-status[hidden] {
      display: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      align-items: stretch;
    }

    .gallery-item {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-page);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }

    .gallery-image-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background-color: var(--border-color);
      flex-shrink: 0;
    }

    .gallery-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-caption {
      padding: 0.85rem;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-main);
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 3.9rem;
    }

    @media (max-width: 992px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }

    .temperature-form {
      max-width: 480px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 0.4rem;
    }

    .required-text {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.85rem;
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .toast {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-width: 280px;
      max-width: min(92vw, 420px);
      padding: 1rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    }

    .toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .toast.toast-success {
      background-color: var(--toast-success-bg);
      color: var(--toast-success-text);
    }

    .toast.toast-error {
      background-color: var(--toast-error-bg);
      color: var(--toast-error-text);
    }

    .toast-message {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .toast-close {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <span class="brand-title">Веб-разработка на клиенте</span>
      <button
        type="button"
        id="theme-toggle-btn"
        class="btn btn-outline"
        aria-label="Переключить цветовую тему"
      >
        Тёмная тема
      </button>
    </div>
  </header>

  <main class="container main-content">
    <h1 class="page-title">Гончарюк Вадим - Лабораторная работа №5</h1>

    <section class="card-section" aria-labelledby="gallery-heading">
      <div class="section-header">
        <h2 id="gallery-heading">Галерея изображений</h2>
        <button type="button" id="refresh-gallery-btn" class="btn btn-primary">
          Обновить галерею
        </button>
      </div>

      <div id="gallery-loader" class="loader-container" role="status" aria-live="polite" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <span>Загрузка изображений...</span>
      </div>

      <p id="gallery-status" class="gallery-status" aria-live="polite" hidden></p>

      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <section class="card-section" aria-labelledby="temperature-heading">
      <h2 id="temperature-heading" class="section-title">Отправка температуры в аудитории</h2>

      <form id="temperature-form" class="temperature-form">
        <div class="form-group">
          <label for="class-input" class="form-label">
            Номер аудитории <span class="required-text">(обязательно)</span>
          </label>
          <input
            type="text"
            id="class-input"
            name="class"
            class="form-control"
            placeholder="Например: Пр-1315"
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="temp-input" class="form-label">
            Температура (°C) <span class="required-text">(обязательно)</span>
          </label>
          <input
            type="number"
            id="temp-input"
            name="temp"
            class="form-control"
            placeholder="Например: 20.2"
            step="any"
            required
            autocomplete="off"
          >
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-temp-btn" class="btn btn-primary">
            Отправить
          </button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <span id="toast-message" class="toast-message"></span>
    <button type="button" id="toast-close-btn" class="toast-close" aria-label="Закрыть уведомление">&times;</button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
